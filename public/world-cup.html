const hash=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
const form=l=>{const o=[];l.forEach((n,r)=>{for(let i=0;i<n;i++)o.push([n==1?0:(i/(n-1)-.5)*1.7,r/(l.length-1)*1.8-.9])});return o};

function teamData(name){const r=rng(hash(name)),k=Object.keys(FORMS);

 return{name,color:new THREE.Color().setHSL((hash(name)>>>0)%360/360,.55,.45),matches,jerseys,path,minute,final:name=='Spain'||name=='Argentina',r}}
function momentum(name){const r=rng(hash(name)+99),ph=[r()*6,r()*6,r()*6],g=[106];

function phSave(){try{localStorage.setItem('wcmp.photos',JSON.stringify(PH_STORE))}catch(e){}}
const nrmT=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'');
const wiki=(q,lim)=>fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit='+lim+'&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=320&exintro=1&explaintext=1&exlimit=max').then(r=>r.json()).then(d=>Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0)));
async function findPhoto(team,name){
 const tn=PHOTO_TEAM_NAMES[team]||team,ali=PH_ALIAS[name]||name,toks=nrmT(name).split(' ').filter(w=>w.length>3),match=p=>{const ti=nrmT(p.title);return !toks.length||toks.some(w=>ti.includes(w))},foot=p=>!p.extract||/football|soccer/i.test(p.extract),thumb=p=>p&&p.thumbnail&&p.thumbnail.source;
 try{const a=await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(name+' '+tn+' football player')+'&gsrnamespace=0&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&format=json&origin=*').then(r=>r.json()),p=a.query&&Object.values(a.query.pages||{})[0];if(p&&p.thumbnail&&p.thumbnail.source)return p.thumbnail.source}catch(e){}
 try{const b=await wiki(ali+' footballer',5),p=b.find(p=>thumb(p)&&match(p)&&foot(p));if(p)return thumb(p)}catch(e){}
 try{const c=await wiki((toks[toks.length-1]||name)+' '+tn+' footballer',5),p=c.find(p=>thumb(p)&&match(p)&&foot(p));if(p)return thumb(p)}catch(e){}
 try{const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|mime&iiurlwidth=320&gsrsearch='+encodeURIComponent(ali)).then(r=>r.json()),ps=Object.values((r.query&&r.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0)),p=ps.find(p=>{const ii=p.imageinfo&&p.imageinfo[0];return ii&&/image\/(jpeg|png|webp)/.test(ii.mime)&&toks.filter(w=>nrmT(p.title).includes(w)).length>=Math.min(2,toks.length)});if(p)return p.imageinfo[0].thumburl||p.imageinfo[0].url}catch(e){}
 return null}
function getPhoto(team,name,num){const key=team+'|'+num;if(PH_STORE[key])return Promise.resolve(PH_STORE[key]);if(PH_PEND[key])return PH_PEND[key];
 return PH_PEND[key]=findPhoto(team,name).then(u=>{if(!u&&EXTRA_PHOTOS[key])u=EXTRA_PHOTOS[key];delete PH_PEND[key];if(u){PH_STORE[key]=u;phSave();new Image().src=u}return u}).catch(()=>{delete PH_PEND[key];return null})}
const WARMED={};function warmTeam(n){if(WARMED[n])return;WARMED[n]=1;prefetchTeam({name:n,jerseys:rosterFor(n)})}
function prefetchTeam(T){const q=T.jerseys.filter(j=>!PH_STORE[T.name+'|'+j.n]);let i=0;const run=()=>{const j=q[i++];if(!j)return;getPhoto(T.name,j.full||j.name,j.n).then(run,run)};for(let k=0;k<5;k++)run()}
function popup(k,t,g,b,l,w,source,team){const photo=$('playerPhoto');photo.style.display='none';photo.removeAttribute('src');photo.alt=t+' photo';$('pk').textContent=k;$('pt').textContent=t;$('pg').textContent=g||'';$('pb').textContent=b;$('pb').style.display=b?'block':'none';$('pop').style.display='flex';if(!team)return;const searchName=(String(t).trim().toUpperCase()==='MESSI'?'Lionel Messi':t);
const num=parseInt(String(k).replace(/\D/g,''),10)||0,key=team+'|'+num,show=src=>{photo.src=src;photo.style.display='block'};
const cached=PH_STORE[key];show(cached||avatarURL(team,{n:num}));
if(!cached)getPhoto(team,searchName,num).then(src=>{if(src&&$('pop').style.display!=='none'&&$('pt').textContent===t)show(src)})}
$('pc').onclick=()=>{$('pop').style.display='none'};$('pop').onclick=e=>{if(e.target.id=='pop')$('pop').style.display='none'};
let viewYaw=0,vi=0,lastMode='';
const VIEWS={hall:[...Array(9)].map((_,i)=>-i*Math.PI*2/9),room:[Math.PI/2,0,-Math.PI/2],final:[0],whatif:[0]};
const VN={room:['Tactics board','Locker room','Jerseys']};
const ad=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function nav(d){const V=VIEWS[S.mode];if(V.length<2)return;vi=S.mode=='hall'?(vi+d+V.length)%V.length:Math.max(0,Math.min(V.length-1,vi+d));viewYaw=V[vi];$('vn').textContent=(VN[S.mode]||[])[vi]||''}
